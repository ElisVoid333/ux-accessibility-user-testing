<html>
    <head>

        <!-- Circles' head scripts [REQUIRED] -->
        <circles-start-scripts/>
        <script src="/worlds/UT-task-3/assets/scripts/teleport-click.js"></script>

        <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>

    </head>

    <body>

        <!-- 2D UI elements overylayed on the 3D scene for user options -->
        <circles-basic-ui/>
        
        <!-- this is used to create our enter UI that creates a 2D overlay to capture a user gesture for sound/mic access etc. -->
        <circles-start-ui/>

        <!-- a-scene with 'circles-properties' component [REQUIRED] -->
        <a-scene circles_scene_properties>
            <a-assets>

                <!-- Circles' built-in assets [REQUIRED] -->
                <circles-assets/>

                <!-- Enviro models -->
                <a-asset-item id="skybox-model" src="/worlds/UT-task-1/assets/models/forest_clearing_1_ground_skybox.glb" response-type="arraybuffer" preload="auto" crossorigin="anonymous"></a-asset-item>
                <a-asset-item id="enviro-model" src="/worlds/UT-task-1/assets/models/simple-room_01.glb" response-type="arraybuffer" preload="auto" crossorigin="anonymous"></a-asset-item>
                <a-asset-item id="TV-model" src="/worlds/UT-task-1/assets/models/simple-TV.glb" response-type="arraybuffer" preload="auto" crossorigin="anonymous"></a-asset-item>
                <a-asset-item id="navmesh_gltf" src="/worlds/UT-task-1/assets/models/simple-room-nav_01.glb" response-type="arraybuffer" preload="auto" crossorigin="anonymous"></a-asset-item>
                <a-asset-item id="mug-model" src="/worlds/UT-task-1/assets/models/object-mug_01.glb" response-type="arraybuffer" preload="auto" crossorigin="anonymous"></a-asset-item>
                <a-asset-item id="book-model" src="/worlds/UT-task-1/assets/models/object-book_01.glb" response-type="arraybuffer" preload="auto" crossorigin="anonymous"></a-asset-item>
                <a-asset-item id="notebook-model" src="/worlds/UT-task-1/assets/models/object-book_03.glb" response-type="arraybuffer" preload="auto" crossorigin="anonymous"></a-asset-item>
                <a-asset-item id="bear-model" src="/worlds/UT-task-1/assets/models/low_poly_asset_teddy_bear.glb" response-type="arraybuffer" preload="auto" crossorigin="anonymous"></a-asset-item>
                <a-asset-item id="cube-model" src="/worlds/UT-task-1/assets/models/rubiks_cube.glb" response-type="arraybuffer" preload="auto" crossorigin="anonymous"></a-asset-item>
                
            </a-assets>

            <!-- Circles' built-in manager and avatar [REQUIRED] -->
            <circles-manager-avatar/>

            <!-- start your code: put your A-frame, Circles XR, and custom components here -->
            
            <a-entity id="enviro"
                      gltf-model="#enviro-model"
                      position="-3.75 0 0"
                      rotation="0 0 0"
                      scale="0.2 0.2 0.2"></a-entity>
            <a-entity id="tv"
                      gltf-model="#TV-model"
                      position="-1.4 0.07 -1.4"
                      rotation="0 -90 0"
                      scale="1.5 1.5 1.5"></a-entity>

            <a-entity id="skybox"
                      gltf-model="#skybox-model"
                      position="0 0 0"
                      rotation="0 0 0"
                      scale="2 2 2"></a-entity>

            <a-entity id="navmesh" circles-interactive-object teleport-click
                      gltf-model="#navmesh_gltf" visible='false' nav-mesh
                      position="-3.75 0 0"
                      rotation="0 0 0"
                      scale="0.2 0.2 0.2"></a-entity>

            <a-entity id="portal-task-2" circles-interactive-visible="false"
                      animation="property: circles-interactive-visible; to: true; delay: 10000;"
                      circles-portal="title_text:Second Task; link_url:/w/UT-task-2;"
                      position="2.5 1.25 1.75"
                      rotation="0 130 0"></a-entity>

            <!-- objects -->
            <a-entity id="mug_01"
                      gltf-model="#mug-model"
                      circles-artefact="descriptionLookAt: true; label_offset: 0 0.5 0; inspectPosition: 0 -0.5 0; inspectRotation: 15 20 0;
                                        label_text: Mug; title: Mary's Mug; description: This is Mary's favorite mug, she likes to use this mug for her morning tea. The number assigned to this item is 24.;"
                      position="-5.6 0.725 -2.12"
                      rotation="0 30 0"
                      scale="0.35 0.35 0.35"></a-entity>
            <a-entity id="book_01"
                      gltf-model="#book-model"
                      circles-artefact="descriptionLookAt: true; label_offset: 0 0.5 0; inspectPosition: 0 -0.5 0; inspectRotation: 15 20 0;
                                        label_text: Book; title: Susan's Diary; description: Property of Susan. DO NOT READ. The number assigned to this item is 48.;"
                      position="-3.05 0.65 -2.05"
                      rotation="7 12 -1"
                      scale="0.3 0.3 0.3"></a-entity>
            <a-entity id="book_02"
                      gltf-model="#notebook-model"
                      circles-artefact="descriptionLookAt: true; label_offset: 0 0.5 0; inspectPosition: 0 -0.5 0; inspectRotation: 15 20 0;
                                        label_text: Notebook; title: Notebook; description: This is marks grocery list. The number assigned to this item is 17.;"
                      position="-2.75 0.78 -2.1"
                      rotation="0 80 0"
                      scale="0.25 0.25 0.25"></a-entity>
            <a-entity id="bear_01"
                      gltf-model="#bear-model"
                      circles-artefact="descriptionLookAt: true; label_offset: 0 0.7 0; inspectPosition: 0 -0.5 0; inspectRotation: 15 20 0;
                                        label_text: Teddy Bear; title: Teddy Bear; description: Annie really likes here teddy bear, she can't sleep without it. The number assigned to this item is 5.;"
                      position="-4 0.625 -2.25"
                      rotation="0 0 0"
                      scale="0.8 0.8 0.8"></a-entity>
            <a-entity id="cube_01"
                      gltf-model="#cube-model"
                      circles-artefact="descriptionLookAt: true; label_offset: 0 0.5 0; inspectPosition: 0 0 0; inspectRotation: 30 20 0; inspectScale: 0.3 0.3 0.3;
                                        label_text: Cube; title: Rubiks Cube; description: This is Jimmy's rubiks cube. The number assigned to this object is 12.;"
                      position="-5 0.3 1.5"
                      rotation="0 30 0"
                      scale="0.15 0.15 0.15"></a-entity>

            <!-- teleport points
            <a-entity class="checkPoint"
                      circles-checkpoint circles-spawnpoint
                      position="-2 0.2 0.9" rotation="0 0 0" scale="0.5 0.5 0.5"></a-entity>
            <a-entity class="checkPoint"
                      circles-checkpoint
                      position="-4.5 0.22 -1" rotation="0 0 0" scale="0.5 0.5 0.5"></a-entity>
            <a-entity class="checkPoint"
                      circles-checkpoint
                      position="1 0.2 -1" rotation="0 0 0" scale="0.5 0.5 0.5"></a-entity>

            end your code: -->
        </a-scene>

        <!-- Circles' end scripts [REQUIRED] -->
        <circles-end-scripts/>

    </body>

</html>
