<html>
    <head>

        <!-- Circles' head scripts [REQUIRED] -->
        <circles-start-scripts/>

        <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>
        <script src="/worlds/UT-task-3/assets/scripts/teleport-click.js"></script>
        <script src="/worlds/UT-task-3/assets/scripts/puzzle-manager.js"></script>
        <script src="/worlds/UT-task-3/assets/scripts/hidden-box.js"></script>

    </head>

    <body>

        <!-- 2D UI elements overylayed on the 3D scene for user options -->
        <circles-basic-ui/>
        
        <!-- this is used to create our enter UI that creates a 2D overlay to capture a user gesture for sound/mic access etc. -->
        <circles-start-ui/>

        <!-- a-scene with 'circles-properties' component [REQUIRED] -->
        <a-scene circles_scene_properties>
            <a-assets>

                <!-- Circles' built-in assets [REQUIRED] -->
                <circles-assets/>

                <!-- Enviro models -->
                <a-asset-item id="skybox-model" src="/worlds/UT-task-3/assets/models/forest_clearing_1_ground_skybox.glb" response-type="arraybuffer" preload="auto" crossorigin="anonymous"></a-asset-item>
                <a-asset-item id="enviro-model" src="/worlds/UT-task-3/assets/models/simple-room_03.glb" response-type="arraybuffer" preload="auto" crossorigin="anonymous"></a-asset-item>
                <a-asset-item id="navmesh_gltf" src="/worlds/UT-task-3/assets/models/simple-room-nav_02.glb" response-type="arraybuffer" preload="auto" crossorigin="anonymous"></a-asset-item>
                <a-asset-item id="mug-model" src="/worlds/UT-task-3/assets/models/object-mug_01.glb" response-type="arraybuffer" preload="auto" crossorigin="anonymous"></a-asset-item>
                <a-asset-item id="book-model" src="/worlds/UT-task-3/assets/models/object-book_01.glb" response-type="arraybuffer" preload="auto" crossorigin="anonymous"></a-asset-item>
                <a-asset-item id="notebook-model" src="/worlds/UT-task-3/assets/models/object-book_03.glb" response-type="arraybuffer" preload="auto" crossorigin="anonymous"></a-asset-item>
                
            </a-assets>

            <!-- Circles' built-in manager and avatar [REQUIRED] -->
            <circles-manager-avatar/>

            <!-- start your code: put your A-frame, Circles XR, and custom components here -->
            
            <a-entity id="enviro"
                      gltf-model="#enviro-model"
                      position="0 0 0"
                      rotation="0 0 0"
                      scale="0.15 0.2 0.15"></a-entity>
            
            <a-entity id="navmesh" circles-interactable-object teleport-click visible="true"
                      gltf-model="#navmesh_gltf"
                      position="0 0 0"
                      rotation="0 0 0"
                      scale="0.15 0.2 0.15"></a-entity>

            <a-entity id="skybox"
                      gltf-model="#skybox-model"
                      position="0 0 0"
                      rotation="0 0 0"
                      scale="2 2 2"></a-entity>

            <a-entity id="portal" circles-interactive-visible="false"
                      circles-portal="title_text:Back To Lobby; link_url:/w/UT-lobby;"
                      position="-3 1.25 -3.5"
                      rotation="0 0 0"></a-entity>
            
            <a-entity id="puzzleManager" puzzle-manager>
                <a-entity id="box_01" hidden-box="pairID: 1;" circles-interactive-object circles-interactive-visible="true"
                      animation__appear="property: circles-interactive-visible; to: true; delay: 500; autoplay: false; startEvents: appear;"
                      animation__hide="property: circles-interactive-visible; to: false; autoplay: false; startEvents: hide;"
                      geometry="primitive:box; width: 1; height: 1; depth: 1" material="color: grey;"
                      position="2 0.7 2.8"
                      rotation="0 0 0"></a-entity>
                <a-entity geometry="primitive:sphere; radius: 0.5;" material="color: blue;"
                      position="2 0.7 2.8"
                      rotation="0 0 0"></a-entity>
                
                <a-entity id="box_02" hidden-box="pairID: 1;" circles-interactive-object circles-interactive-visible="true"
                      animation__appear="property: circles-interactive-visible; to: true; delay: 500; autoplay: false; startEvents: appear;"
                      animation__hide="property: circles-interactive-visible; to: false; autoplay: false; startEvents: hide;"
                      geometry="primitive:box; width: 1; height: 1; depth: 1" material="color: grey;"
                      position="4 0.7 2.8"
                      rotation="0 0 0"></a-entity>
                <a-entity geometry="primitive:sphere; radius: 0.5;" material="color: blue;"
                      position="4 0.7 2.8"
                      rotation="0 0 0"></a-entity>
                
                <a-entity id="box_03" hidden-box="pairID: 2;" circles-interactive-object circles-interactive-visible="true"
                      animation__appear="property: circles-interactive-visible; to: true; delay: 500; autoplay: false; startEvents: appear;"
                      animation__hide="property: circles-interactive-visible; to: false; autoplay: false; startEvents: hide;"
                      geometry="primitive:box; width: 1; height: 1; depth: 1" material="color: grey;"
                      position="-2 0.7 2.8"
                      rotation="0 0 0"></a-entity>
                <a-entity geometry="primitive:sphere; radius: 0.5;" material="color: orange;"
                      position="-2 0.7 2.8"
                      rotation="0 0 0"></a-entity>
                
                <a-entity id="box_04" hidden-box="pairID: 2;" circles-interactive-object circles-interactive-visible="true"
                      animation__appear="property: circles-interactive-visible; to: true; delay: 500; autoplay: false; startEvents: appear;"
                      animation__hide="property: circles-interactive-visible; to: false; autoplay: false; startEvents: hide;"
                      geometry="primitive:box; width: 1; height: 1; depth: 1" material="color: grey;"
                      position="6 0.7 2.8"
                      rotation="0 0 0"></a-entity>
                <a-entity geometry="primitive:sphere; radius: 0.5;" material="color: orange;"
                      position="6 0.7 2.8"
                      rotation="0 0 0"></a-entity>
                
                <a-entity id="box_05" hidden-box="pairID: 3;" circles-interactive-object circles-interactive-visible="true"
                      animation__appear="property: circles-interactive-visible; to: true; delay: 500; autoplay: false; startEvents: appear;"
                      animation__hide="property: circles-interactive-visible; to: false; autoplay: false; startEvents: hide;"
                      geometry="primitive:box; width: 1; height: 1; depth: 1" material="color: grey;"
                      position="0 0.7 2.8"
                      rotation="0 0 0"></a-entity>
                <a-entity geometry="primitive:sphere; radius: 0.5;" material="color: red;"
                      position="0 0.7 2.8"
                      rotation="0 0 0"></a-entity>
                
                <a-entity id="box_06" hidden-box="pairID: 3;" circles-interactive-object circles-interactive-visible="true"
                      animation__appear="property: circles-interactive-visible; to: true; delay: 500; autoplay: false; startEvents: appear;"
                      animation__hide="property: circles-interactive-visible; to: false; autoplay: false; startEvents: hide;"
                      geometry="primitive:box; width: 1; height: 1; depth: 1" material="color: grey;"
                      position="8 0.7 2.8"
                      rotation="0 0 0"></a-entity>
                <a-entity geometry="primitive:sphere; radius: 0.5;" material="color: red;"
                      position="8 0.7 2.8"
                      rotation="0 0 0"></a-entity>
            </a-entity>

            <!-- teleport points -->
            <a-entity class="checkPoint"
                      circles-checkpoint circles-spawnpoint
                      position="3 0.2 -2" rotation="0 0 0" scale="0.5 0.5 0.5"></a-entity>
            <a-entity class="checkPoint"
                      circles-checkpoint
                      position="-1 0.22 1" rotation="0 0 0" scale="0.5 0.5 0.5"></a-entity>
            <a-entity class="checkPoint"
                      circles-checkpoint
                      position="7 0.2 1" rotation="0 0 0" scale="0.5 0.5 0.5"></a-entity>

            <!-- end your code: -->
        </a-scene>

        <!-- Circles' end scripts [REQUIRED] -->
        <circles-end-scripts/>

    </body>

</html>
